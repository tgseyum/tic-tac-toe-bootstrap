<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="card shadow-lg border-0 game-card">
        <div class="card-body p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
              <p class="text-uppercase text-primary fw-bold mb-1">Game</p>
              <h1 class="mb-0">Tic-Tac-Toe</h1>
            </div>
            <button id="restart-button" class="btn btn-primary btn-lg" type="button">
              New Game
            </button>
          </div>

          <div class="player-indicator-row mb-4">
            <div class="player-pill active" id="player-x-indicator">Player 1 (X)</div>
            <div class="player-pill" id="player-o-indicator">Player 2 (O)</div>
          </div>

          <div class="status-box text-center mb-4">
            <span id="status-text" class="badge rounded-pill text-bg-light px-4 py-2 fs-5" aria-live="polite">
              Player 1 (X)'s turn
            </span>
          </div>

          <div id="board" class="board mx-auto" aria-label="Tic-Tac-Toe board">
            <button class="cell" data-index="0" aria-label="Cell 1" type="button"></button>
            <button class="cell" data-index="1" aria-label="Cell 2" type="button"></button>
            <button class="cell" data-index="2" aria-label="Cell 3" type="button"></button>
            <button class="cell" data-index="3" aria-label="Cell 4" type="button"></button>
            <button class="cell" data-index="4" aria-label="Cell 5" type="button"></button>
            <button class="cell" data-index="5" aria-label="Cell 6" type="button"></button>
            <button class="cell" data-index="6" aria-label="Cell 7" type="button"></button>
            <button class="cell" data-index="7" aria-label="Cell 8" type="button"></button>
            <button class="cell" data-index="8" aria-label="Cell 9" type="button"></button>
          </div>

          <div class="row g-3 mt-4 text-center">
            <div class="col-4">
              <div class="score-box player-one-box">
                <span class="label">Player 1 (X)</span>
                <strong id="score-x">0</strong>
              </div>
            </div>
            <div class="col-4">
              <div class="score-box">
                <span class="label">Draws</span>
                <strong id="score-draws">0</strong>
              </div>
            </div>
            <div class="col-4">
              <div class="score-box player-two-box">
                <span class="label">Player 2 (O)</span>
                <strong id="score-o">0</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
